# Activer avec : --spring.profiles.active=prod
# Le datasource est construit par com.esgis2026.assigame.config.DataSourceConfig
# (bean @Profile("prod")) qui lit directement PGHOST, PGPORT, PGUSER, PGPASSWORD,
# PGDATABASE via System.getenv() au runtime, garantissant que les variables
# injectées par Railway pour le service Postgres sont bien résolues.

# En v1 on garde update ; passer à validate + Flyway en v2.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.seed.purge-demo=false

spring.web.resources.static-locations=classpath:/static/,file:front/

server.error.include-message=never
server.error.include-stacktrace=never
