# Activer avec : --spring.profiles.active=prod
# Variables d'environnement : Railway injecte automatiquement PGHOST, PGPORT, PGUSER,
# PGPASSWORD, PGDATABASE pour son service Postgres. DB_URL/DB_USER/DB_PASSWORD restent
# supportés en fallback via application.properties.

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# En v1 on garde update ; passer à validate + Flyway en v2.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
app.seed.purge-demo=false

spring.web.resources.static-locations=classpath:/static/,file:front/

server.error.include-message=never
server.error.include-stacktrace=never
