spring:
  application:
    name: assigame
  server:
    port: ${PORT:8090}
  profiles:
    active: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  web:
    resources:
      static-locations: classpath:/static/,file:front/

app:
  jwt:
    secret: ${JWT_SECRET:assigame-secret-key-2026-min-32-chars!!}
  seed:
    purge-demo: false
