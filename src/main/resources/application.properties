spring.application.name=assigame
server.port=${PORT:8090}
spring.profiles.active=prod

# Let prod profile provide datasource config via DataSourceConfig bean
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.web.resources.static-locations=classpath:/static/,file:front/

app.jwt.secret=${JWT_SECRET:assigame-secret-key-2026-min-32-chars!!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# true = purge produits/commandes/comptes non-admin au démarrage.
# Remettre à true seulement si tu veux re-vider la base, puis repasser à false.
app.seed.purge-demo=false
